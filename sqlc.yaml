version: "2"

overrides:
  go:
    overrides:
      - db_type: uuid
        go_type:
          import: uuid
          type: UUID

sql:
  - engine: postgresql
    schema: internal/postgres/migrations
    queries: internal/postgres/queries
    gen:
      go:
        package: postgres
        out: internal/postgres
        sql_package: database/sql
